# Drop-in for llama-coordinator, llama-worker, llama-embed and vision-server on VM 102, installed as
# /etc/systemd/system/<unit>.service.d/wait-gpus.conf. Keeps an engine from starting on the CPU
# because amdgpu was not ready yet at boot (see /usr/local/bin/wait-for-gpus.sh).
[Service]
ExecStartPre=/usr/local/bin/wait-for-gpus.sh
