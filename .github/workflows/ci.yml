name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Tests (Python ${{ matrix.python-version }} on ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, windows-latest ]
        python-version: [ '3.11', '3.12' ]

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      # no submodules: no test needs server setup/obsidian-vault-cli, and its pinned commit is a local fork

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'

    - name: Set up Node.js (the voice-mode and Alexa-skill tests run real JavaScript)
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    # The runner blocks every non-localhost connection, so no test can reach (or depend on) the homelab
    - name: Unit tests (network blocked)
      run: python tests/run_tests.py

    - name: GGUF pipeline trainer tests
      run: |
        pip install pyyaml
        python -m unittest discover -s pipeline-gguf-trainer/tests -p "test_*.py"
